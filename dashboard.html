<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StudyPlan - Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="crescent"></div>
  <div class="stars-container" id="stars-container"></div>
  
  <div class="wrapper">
    <header class="dashboard-header">
      <div class="header-left">
        <img src="/logo.png" alt="Logo" class="logo">
        <h1 class="site-title">StudyPlan</h1>
      </div>
      <!-- <nav class="header-nav">
        <a href="/">Dashboard</a>
        <a href="/planner.html">Planner</a>
        <a href="/planner.html#calendar">Calendar</a>
        <a href="#" id="nav-settings">Settings</a>
      </nav> -->
    </header>

    <div class="dashboard-content">
      <div class="greeting-section">
        <div class="greeting-text" id="greeting-text">Good morning</div>
        <div class="user-name" id="user-name">Chinmayee</div>
        <div class="date-text" id="date-text"></div>
      </div>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-number" id="total-tasks">0</div>
          <div class="stat-label">total tasks</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="completed-tasks">0</div>
          <div class="stat-label">completed</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="pending-tasks">0</div>
          <div class="stat-label">pending</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="due-tasks">0</div>
          <div class="stat-label">due soon</div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <div class="card-header">
            <span class="card-title">Upcoming Deadlines</span>
          </div>
          <div class="deadline-list" id="deadline-list">
            <div class="empty-state">No upcoming deadlines</div>
          </div>
        </div>

        <div class="dashboard-card">
          <div class="card-header">
            <span class="card-title">Today's Priority</span>
          </div>
          <div class="priority-list" id="priority-list">
            <div class="empty-state">No tasks for today</div>
          </div>
        </div>

        <div class="dashboard-card">
            <div class="card-header">
                <span class="card-title">Recent Activity</span>
            </div>
            <div class="recent-list" id="recent-list">
                <div class="empty-state">No recent activity</div>
            </div>
            </div>
      </div>

      <button class="start-planning-btn" id="start-planning-btn">
        Start Planning
        <span class="arrow">→</span>
      </button>
    </div>
  </div>

  <div class="custom-cursor"></div>

  <script type="module" src="/js/dashboard.js"></script>
  <script>
    const cursor = document.querySelector('.custom-cursor');
    const interactive = document.querySelectorAll('button, .stat-item, .dashboard-card, .start-planning-btn, .header-nav a');
    
    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', function(e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      
      interactive.forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          cursor.classList.add('active');
        });
        el.addEventListener('mouseleave', function() {
          cursor.classList.remove('active');
        });
      });
    }

    function createStars() {
      const starsContainer = document.getElementById('stars-container');
      if (!starsContainer) return;
      
      starsContainer.innerHTML = '';
      const starCount = 300;
      const starShapes = ['✦', '✧', '★', '☆', '✴', '✳', '⋆'];
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.textContent = starShapes[Math.floor(Math.random() * starShapes.length)];
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.fontSize = (Math.random() * 12 + 6) + 'px';
        star.style.animationDelay = Math.random() * 8 + 's';
        star.style.animationDuration = (Math.random() * 4 + 2) + 's';
        star.style.opacity = Math.random() * 0.5 + 0.3;
        starsContainer.appendChild(star);
      }
    }
    
    createStars();
  </script>
</body>
</html>
